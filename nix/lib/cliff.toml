# git-cliff configuration for ontrack release notes.
# Conventional Commits grouping; non-conventional commits are kept under
# "Other" (filter_unconventional = false) so notes are never silently empty.
# Used by `nix run .#release`; if cliff still yields nothing usable the app
# falls back to a `git log` summary.
#
# NOTE: no `skip_tags` here. The release app's tag-must-not-exist check plus
# dry-run-never-tags guarantee means a dry-run tag can never exist in the
# repo; a skip_tags regex like "v0.0.0-dryrun" would also match the --tag
# value being generated (regex substring match) and silently empty the notes.

[changelog]
header = ""
body = """
{% if version %}
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## unreleased
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first | trim }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^doc", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^style", group = "Styling" },
    { message = "^test", group = "Testing" },
    { message = "^chore", group = "Chores" },
    { message = "^ci", group = "CI" },
    { message = "^revert", group = "Reverts" },
    { message = ".*", group = "Other" },
]
filter_commits = false
tag_pattern = "^v[0-9].*"
