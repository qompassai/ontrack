<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>OnTrack — Field Route Optimizer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <link data-trunk rel="rust" data-bin="ontrack" data-wasm-opt="2" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #1b1b1b;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #e0e0e0;
            font-family: system-ui, sans-serif;
            font-size: 1.1rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- eframe renders into this canvas (see src/main.rs). -->
    <canvas id="ontrack_canvas"></canvas>
    <div id="loading"><p>Loading OnTrack…</p></div>
</body>
</html>
